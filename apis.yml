aid: superops
name: SuperOps
description: >-
  SuperOps is a unified PSA (Professional Services Automation) and RMM (Remote
  Monitoring and Management) platform for managed service providers (MSPs) and
  internal IT teams, spanning service desk and ticketing, endpoint monitoring,
  patch management, asset and IT documentation, project management, billing and
  invoicing, and AI-assisted operations. SuperOps exposes a public GraphQL API
  with separate MSP and IT surfaces across US and EU data centers, giving
  programmatic access to clients, tickets, assets, users, invoices, knowledge
  base, and service catalog data. Requests authenticate with a bearer API token
  plus a CustomerSubDomain header and are limited to 800 requests per minute.
